name: Add new issues to Core Issues board

on:
  issues:
    types: [opened]

env:
  PROJECT_ID: PVT_kwDOAeNBW84AYzQK # Core Issues project board
  STATUS_FIELD_ID: PVTSSF_lADOAeNBW84AYzQKzgP22rg # Status single-select field
  TRIAGE_OPTION_ID: "8141bb89" # Status option: "Triage"

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Add issue and set Triage status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {
                projectId: $projectId
                contentId: $contentId
              }) {
                item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" \
            -f contentId="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" \
            -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" \
            -f optionId="$TRIAGE_OPTION_ID"
